name: Validate

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install checks
        run: python -m pip install ruff pyyaml
      - name: Ruff
        working-directory: codex-away
        run: ruff check .
      - name: Tests
        working-directory: codex-away
        run: python -m unittest discover -s tests -v
      - name: Skill structure
        working-directory: codex-away
        run: |
          python - <<'PY'
          import pathlib
          import yaml
          text = pathlib.Path("SKILL.md").read_text()
          assert text.startswith("---\n") and "\nname: codex-away\n" in text
          yaml.safe_load(text.split("---", 2)[1])
          print("Skill frontmatter is valid")
          PY
